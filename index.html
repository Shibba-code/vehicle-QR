    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px 15px;
        }

        .card {
            max-width: 600px;
            margin: 15px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        .logo {
            display: block;
            max-width: 330px;
            max-height: 150px;
            width: auto;
            height: auto;
            margin: 0 auto 5px;
            object-fit: contain;
        }

        h2 {
            text-align: center;
            margin: 0 0 25px;
            font-size: 28px;
            color: #222;
        }

        .details {
            width: 100%;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            overflow: hidden;
        }

        .row {
            display: grid;
            grid-template-columns: 45% 55%;
            min-height: 48px;
            border-bottom: 1px solid #e5e5e5;
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: bold;
            color: #333;
            background: #f7f8f9;
            padding: 14px;
        }

        .value {
            color: #111;
            padding: 14px;
        }

        .valid {
            margin-top: 20px;
            padding: 15px;
            text-align: center;
            background: #eef9f1;
            border: 1px solid #b9e2c3;
            border-radius: 8px;
            color: #176b2c;
            font-weight: bold;
        }

        .expired {
            text-align: center;
            color: #c00;
            font-size: 30px;
            font-weight: bold;
            padding: 30px 0 10px;
        }

        .expired-text {
            text-align: center;
            color: #555;
        }

        .not-found {
            text-align: center;
            color: #c00;
            font-size: 28px;
            font-weight: bold;
            padding: 30px 0 10px;
        }

        @media (max-width: 500px) {

            body {
                padding: 15px 10px;
            }

            .card {
                padding: 20px 15px;
                margin: 10px auto;
            }

            .logo {
                max-width: 260px;
                max-height: 120px;
                margin-bottom: 5px;
            }

            h2 {
                font-size: 23px;
                margin-bottom: 20px;
            }

            .row {
                grid-template-columns: 42% 58%;
                font-size: 14px;
            }

            .label,
            .value {
                padding: 11px 8px;
            }
        }
    </style>
</head>
